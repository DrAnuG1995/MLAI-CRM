# Build the Vite SPA and publish it to GitHub Pages.
#
# The Supabase URL + publishable key are injected from repo variables
# (Settings -> Secrets and variables -> Actions -> Variables): VITE_SUPABASE_URL
# and VITE_SUPABASE_ANON_KEY. The publishable key is public by design (it ships
# in the bundle); data is protected by Supabase Auth + row-level security.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions. Add
# public/CNAME if serving from a custom domain such as crm.mlai.au.
name: Deploy CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Stop Pages mangling the output
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
